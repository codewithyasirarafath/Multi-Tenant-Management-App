# Local development PostgreSQL. Usage: npm run db:up / db:down / db:reset
# Credentials come from .env (interpolated automatically), with safe defaults.
services:
  postgres:
    image: postgres:16-alpine
    container_name: learn-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-delivery_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-delivery_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
